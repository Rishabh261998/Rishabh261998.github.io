# Site settings
title: "Rishabh Sanjay"
tagline: "Machine learning engineer & researcher"
description: "Rishabh Sanjay is a machine learning engineer and researcher in San Francisco, currently a Founding AI Engineer at Cekura. MS in Computer Science from Purdue University, BS from IIT Kanpur. Research on the information capacity of transformers, reasoning in LLMs and Legal NLP, with papers at ACL and EMNLP."
url: "https://rishabh261998.github.io"
baseurl: ""
repository: "Rishabh261998/Rishabh261998.github.io"
locale: "en_US"
timezone: America/Los_Angeles

author:
  name: "Rishabh Sanjay"
  role: "Founding AI Engineer at Cekura"
  location: "San Francisco, California"
  email: "rishabh.lfs@gmail.com"
  avatar: "/images/profile.jpg"
  resume: "/files/Rishabh_Sanjay_Resume.pdf"
  github: "https://github.com/Rishabh261998"
  linkedin: "https://www.linkedin.com/in/rishabh-sanjay-13b718152/"
